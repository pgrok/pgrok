; Only set the options to change, all options and their defaults are listed in
; pgrokd/cli/internal/embed/config.ini.

[server]
EXTERNAL_URL = http://localhost:3320

[proxy]
DOMAIN = localhost:3000

; Serve HTTPS natively, see docs/admin/https.md. EXTERNAL_URL must use https.
;[tls]
;HTTP_REDIRECT_PORT = 80
; Either use certificate files.
;CERT_FILES = /etc/letsencrypt/live/example.com/fullchain.pem
;KEY_FILES = /etc/letsencrypt/live/example.com/privkey.pem
; Or obtain certificates automatically through ACME DNS-01 challenges.
;ACME_EMAIL = admin@example.com
;ACME_DNS_PROVIDER = cloudflare
;[tls.acme_dns]
;API_TOKEN = ${CLOUDFLARE_API_TOKEN}

[database]
USER = REDACTED
PASSWORD = REDACTED

[identity_provider]
TYPE = oidc
DISPLAY_NAME = Google
ISSUER = https://accounts.google.com
CLIENT_ID = REDACTED
CLIENT_SECRET = REDACTED
; Only allow emails of this domain to sign in.
;REQUIRED_DOMAIN = example.com
; Only allow these emails to sign in (case-insensitive). When REQUIRED_DOMAIN is also set, both must match.
;ALLOWED_EMAILS = alice@example.com, bob@example.com
