# The address of the remote SSH server.
remote_addr: "127.0.0.1:2222"
# The address to forward requests to.
forward_addr: "http://127.0.0.1:2830"

# The authentication token.
token: "REDACTED"

# The SHA256 fingerprint of the server's ssh-rsa host key to pin, instead of
# trusting it on first use and recording it in the "known_hosts" file next to
# this config file.
#host_key_fingerprint: "SHA256:..."

# Dynamic forward rules and use "forward_addr" as catch-all.
#dynamic_forwards: |
#  /api http://localhost:8080

# Rewrite the Host header to the host of the forward address for local apps that
# reject unknown hosts. The public host is kept in X-Forwarded-Host.
#host_header: rewrite
