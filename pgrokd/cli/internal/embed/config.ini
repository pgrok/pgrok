[server]
; The external-facing URL of the web server, as it appears in the browser
; address bar.
EXTERNAL_URL = http://localhost:3320

[web]
; The port for the web server to listen on.
PORT = 3320

[proxy]
; The port for the proxy server to listen on.
PORT = 3000
; The scheme of the tunnel URLs. Set "https" only if you have configured a
; wildcard SSL certificate.
SCHEME = http
; The domain of the tunnel URLs, e.g., "unknwon.localhost:3000".
DOMAIN = localhost:3000
; The domain of the TCP tunnel addresses. Defaults to DOMAIN without the port.
TCP_DOMAIN =
; The range of ports for TCP tunnels, from TCP_PORT_START (inclusive) to
; TCP_PORT_END (exclusive).
TCP_PORT_START = 10000
TCP_PORT_END = 15000

[sshd]
; The port for the SSH server to listen on, which clients connect to.
PORT = 2222

[database]
; PostgreSQL host address, or the path of a UNIX domain socket.
HOST = localhost
; PostgreSQL port.
PORT = 5432
; Database user.
USER = pgrokd
; Database password.
PASSWORD =
; Database name.
NAME = pgrokd

[identity_provider]
; The type of the identity provider, only "oidc" is supported. Leave empty to
; disable signing in.
TYPE =
; The name shown on the sign-in button, e.g., "Google".
DISPLAY_NAME =
; The OIDC issuer URL, e.g., "https://accounts.google.com".
ISSUER =
CLIENT_ID =
CLIENT_SECRET =
; The claim to read the identifier of a user from, which makes up the
; subdomain of their tunnels.
CLAIM_IDENTIFIER = email
; The claim to read the display name of a user from. Defaults to the
; identifier when the claim is empty.
CLAIM_DISPLAY_NAME = name
; The claim to read the email of a user from. Required by REQUIRED_DOMAIN and
; ALLOWED_EMAILS.
CLAIM_EMAIL = email
; Only allow emails of this domain to sign in, e.g., "example.com".
REQUIRED_DOMAIN =
; Comma-separated list of emails allowed to sign in (case-insensitive), e.g.,
; "alice@example.com, bob@example.com". When REQUIRED_DOMAIN is also set, both
; must match.
ALLOWED_EMAILS =
