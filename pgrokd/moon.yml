$schema: "https://moonrepo.dev/schemas/project.json"

language: "go"
stack: "backend"
id: "pgrokd"

fileGroups:
  sources:
    - "/pgrokd/**/*.go"
    - "/internal/**/*.go"
  tests:
    - "/pgrokd/**/*_test.go"
    - "/internal/**/*_test.go"
  configs:
    - "/go.mod"
    - "/go.sum"
    - "/.golangci.yml"
  assets:
    - "/pgrokd/cli/dist/**/*"

tasks:
  # Dev build: the web app is NOT embedded (the !prod build tag proxies to the
  # live Vite server), so this does not need pgrokd-web:build.
  build:
    command: "go build -v -trimpath -o .bin/pgrokd ./pgrokd/cli"
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "@group(sources)"
      - "@group(configs)"
    outputs:
      - "/.bin/pgrokd"

  # Prod build: -tags prod embeds the web app, so the assets must be built first.
  build-prod:
    command: "go build -v -trimpath -tags prod -o .bin/pgrokd ./pgrokd/cli"
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "@group(sources)"
      - "@group(configs)"
      - "@group(assets)"
    outputs:
      - "/.bin/pgrokd"
    deps:
      - "pgrokd-web:build"

  test:
    command: "go test -cover -race ./..."
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "@group(configs)"

  lint:
    command: "golangci-lint run"
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "@group(sources)"
      - "@group(configs)"

  format:
    command: "golangci-lint fmt"
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "@group(sources)"
      - "@group(configs)"

  run:
    command: ".bin/pgrokd"
    preset: "server"
    options:
      runFromWorkspaceRoot: true
    deps:
      - "build"

  # Build with embedded web assets and run, mirroring a production binary.
  prod:
    command: ".bin/pgrokd"
    preset: "server"
    options:
      runFromWorkspaceRoot: true
    deps:
      - "build-prod"

  oidc-server:
    command: "go run ./integration-tests/oidc-server"
    preset: "server"
    options:
      runFromWorkspaceRoot: true

  dev:
    command: ".bin/pgrokd"
    preset: "server"
    options:
      runFromWorkspaceRoot: true
    deps:
      - "build"
      - "pgrokd-web:dev"
      - "oidc-server"
