$schema: "https://moonrepo.dev/schemas/project.json"

language: "go"
stack: "backend"
id: "pgrokd"

fileGroups:
  sources:
    - "/pgrokd/**/*.go"
    - "/internal/**/*.go"
  tests:
    - "/pgrokd/**/*_test.go"
    - "/internal/**/*_test.go"
  configs:
    - "/go.mod"
    - "/go.sum"
    - "/.golangci.yml"
  assets:
    - "/pgrokd/cli/dist/**/*"

tasks:
  build:
    command: "go build -v -trimpath -o .bin/pgrokd ./pgrokd/cli"
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "@group(sources)"
      - "@group(configs)"
      - "@group(assets)"
    outputs:
      - "/.bin/pgrokd"
    deps:
      - "pgrokd-web:build"

  build-release:
    script: |
      go build -v -trimpath \
        -ldflags "-X 'main.version=${BUILD_VERSION}' -X 'main.commit=$(git rev-parse HEAD)' -X 'main.date=$(date -u '+%Y-%m-%d %I:%M:%S %Z')'" \
        -o .bin/pgrokd ./pgrokd/cli
    env:
      BUILD_VERSION: "unknown"
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "@group(sources)"
      - "@group(configs)"
      - "@group(assets)"
    outputs:
      - "/.bin/pgrokd"
    deps:
      - "pgrokd-web:build"

  test:
    command: "go test -cover -race ./..."
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "@group(configs)"

  lint:
    command: "golangci-lint run"
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "@group(sources)"
      - "@group(configs)"

  format:
    command: "golangci-lint fmt"
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "@group(sources)"
      - "@group(configs)"

  run:
    command: ".bin/pgrokd"
    preset: "server"
    options:
      runFromWorkspaceRoot: true
    deps:
      - "build"

  oidc-server:
    command: "go run ./integration-tests/oidc-server"
    preset: "server"
    options:
      runFromWorkspaceRoot: true

  dev:
    command: ".bin/pgrokd"
    preset: "server"
    options:
      runFromWorkspaceRoot: true
    deps:
      - "build"
      - "pgrokd-web:dev"
      - "oidc-server"
